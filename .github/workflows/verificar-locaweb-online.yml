name: Verificar Ateliello em produção na Locaweb
on:
  push:
    paths:
      - '.github/workflows/verificar-locaweb-online.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Conferir HTTPS, paginas, logo, JavaScript e SEO em producao
        run: |
          python3 - <<'PY'
          import urllib.request, ssl
          base="https://ateliello.com.br"
          checks={
            "/": [b'Ateliello',b'index,follow,max-image-preview:large',b'logo-ateliello-com-assinatura.png',b'Sua identidade'],
            "/robots.txt": [b'Allow: /',b'sitemap.xml'],
            "/sitemap.xml": [b'ateliello.com.br',b'<urlset'],
            "/app.js": [b'const $=',b'$$'],
            "/style.css": [b'.site-head',b'revis'],
            "/assets/logo-ateliello-com-assinatura.png": [],
            "/uniformes-personalizados.html": [b'index,follow,max-image-preview:large'],
            "/bordados-personalizados.html": [b'index,follow,max-image-preview:large'],
            "/toalhas-roupoes-personalizados.html": [b'index,follow,max-image-preview:large'],
            "/orcamento.html": [b'Ateliello'],
            "/contato.html": [b'Ateliello']
          }
          failed=[]
          for path,needles in checks.items():
            try:
              request=urllib.request.Request(base+path,headers={"User-Agent":"Ateliello-Production-QA/1.0"})
              with urllib.request.urlopen(request,timeout=18,context=ssl.create_default_context()) as response:
                data=response.read(300000)
                code=response.status
                ok=code==200 and all(marker.lower() in data.lower() for marker in needles)
                print("HTTPS",code,path,"bytes=",len(data),"marcadores=",ok)
                if not ok:failed.append(path)
            except Exception as ex:
              print("Falha",path,type(ex).__name__,str(ex)[:200])
              failed.append(path)
          print("VERIFICADOS=",len(checks)-len(failed),"/",len(checks))
          if failed:
            print("FALHAS=",",".join(failed))
            raise SystemExit(1)
          PY
