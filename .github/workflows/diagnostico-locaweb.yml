name: Diagnosticar conexão pública Locaweb
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostico-locaweb.yml'
permissions:
  contents: read
jobs:
  verificar-sem-credenciais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir DNS público
        shell: bash
        run: |
          for host in ateliello.com.br www.ateliello.com.br ftp.ateliello.com.br ftp.ateliello1.hospedagemdesites.ws; do
            echo "::group::DNS $host"
            getent ahostsv4 "$host" | head -3 || true
            echo "::endgroup::"
          done
      - name: Inspecionar handshake FTPS explícito sem autenticação
        shell: bash
        run: |
          host=ftp.ateliello1.hospedagemdesites.ws
          echo "Verificando porta 21 e certificado de $host"
          timeout 25 bash -c 'echo QUIT | openssl s_client -starttls ftp -connect "$1:21" -servername "$1" 2>&1' bash "$host" | grep -E 'subject=|issuer=|Verify return code|verify error|CONNECTED|Verification:' | head -20 || true
      - name: Testar portas e resposta HTTP de configuração
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host='ftp.ateliello1.hospedagemdesites.ws'
          for port in (21,22,80,443):
              try:
                  c=socket.create_connection((host,port),timeout=4)
                  c.settimeout(3)
                  if port==21:
                      try: print('FTP saudação:',repr(c.recv(180)))
                      except Exception as e: print('FTP conectado sem saudação:',type(e).__name__)
                  else: print('TCP',port,'conexão estabelecida')
                  c.close()
              except Exception as e: print('TCP',port,'não conectou:',type(e).__name__,str(e)[:100])
          PY
          curl -sSI --connect-timeout 5 --max-time 8 http://ateliello.com.br/ | head -10 || true
      - name: Verificar HTTPS do domínio sem autenticação
        shell: bash
        run: |
          curl -sIL --connect-timeout 8 --max-time 20 -o /dev/null -w 'HTTPS resposta=%{http_code}, IP=%{remote_ip}, redirecionamentos=%{num_redirects}\n' https://ateliello.com.br/ || true
