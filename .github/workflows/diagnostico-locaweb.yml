name: Diagnosticar conexão pública Locaweb
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostico-locaweb.yml'
permissions:
  contents: read
jobs:
  verificar-sem-credenciais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir DNS público
        shell: bash
        run: |
          for host in ateliello.com.br www.ateliello.com.br ftp.ateliello.com.br ftp.ateliello1.hospedagemdesites.ws; do
            echo "::group::DNS $host"
            getent ahostsv4 "$host" | head -3 || true
            echo "::endgroup::"
          done
      - name: Testar AUTH TLS e certificado FTPS sem senha
        shell: bash
        run: |
          python3 - <<'PY'
          import socket,ssl
          host='ftp.ateliello1.hospedagemdesites.ws'
          with socket.create_connection((host,21),timeout=5) as sock:
            sock.settimeout(5)
            print('Saudação:',sock.recv(256).decode('latin1',errors='replace').strip())
            sock.sendall(b'AUTH TLS\r\n')
            response=sock.recv(512).decode('latin1',errors='replace').strip()
            print('Resposta AUTH TLS:',response)
            if response.startswith('234'):
              try:
                with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as tls:
                  print('TLS válido:',tls.version(),tls.getpeercert().get('subject'))
              except ssl.SSLCertVerificationError as ex: print('TLS certificado não validado:',str(ex)[:250])
          PY
      - name: Testar portas e resposta HTTP de configuração
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host='ftp.ateliello1.hospedagemdesites.ws'
          for port in (21,22,80,443):
              try:
                  c=socket.create_connection((host,port),timeout=4)
                  c.settimeout(3)
                  if port==21:
                      try: print('FTP saudação:',repr(c.recv(180)))
                      except Exception as e: print('FTP conectado sem saudação:',type(e).__name__)
                  else: print('TCP',port,'conexão estabelecida')
                  c.close()
              except Exception as e: print('TCP',port,'não conectou:',type(e).__name__,str(e)[:100])
          PY
          curl -sSI --connect-timeout 5 --max-time 8 http://ateliello.com.br/ | head -10 || true
      - name: Verificar HTTPS do domínio sem autenticação
        shell: bash
        run: |
          curl -sSIL --connect-timeout 8 --max-time 20 -o /dev/null -w 'HTTPS resposta=%{http_code}, IP=%{remote_ip}, redirecionamentos=%{num_redirects}\n' https://ateliello.com.br/ || true
