name: Gerar imagens de prévia Ateliello
on:
  push:
    branches: [main]
    paths:
      - 'assets-source/atlas.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Gerar arquivos das imagens
        run: python tools/unpack_atlas.py
      - name: Commitar imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "assets: adicionar imagens de prévia do acervo Ateliello"
            git push
          fi
