name: Validar site
on: [push, pull_request]
jobs:
  revisar-recursos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
      - run: node --check app.js
      - run: node scripts/check_assistant.mjs
      - run: node scripts/check_campaign.mjs
      - run: node scripts/check_brand.mjs
      - run: node --check app.js
