name: Preparar pacote Locaweb
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: node --check app.js
      - name: Gerar pacote de prévia (sem indexação)
        run: node scripts/build_locaweb.mjs
      - name: Validar SEO da prévia
        run: node scripts/check_release.mjs
      - name: Compactar site para testes
        run: cd dist-locaweb && zip -q -r ../Ateliello_PREVIA_Locaweb.zip .
      - name: Disponibilizar pacote
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ateliello_PREVIA_Locaweb
          path: Ateliello_PREVIA_Locaweb.zip
          retention-days: 14
      - name: Gerar candidato de produção SEO sem publicar
        env:
          RELEASE_APPROVED: "yes"
          SITE_URL: https://ateliello.com.br
        run: node scripts/build_locaweb.mjs --production
      - name: Validar SEO do candidato de produção
        env:
          SITE_URL: https://ateliello.com.br
        run: node scripts/check_release.mjs --production
      - name: Compactar candidato de produção
        run: cd dist-locaweb && zip -q -r ../Ateliello_PRODUCAO_CANDIDATA.zip .
      - name: Guardar versão candidata para transferência aprovada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ateliello_PRODUCAO_CANDIDATA_SEO_NAO_PUBLICADA
          path: Ateliello_PRODUCAO_CANDIDATA.zip
          retention-days: 14
