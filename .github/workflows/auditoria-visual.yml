name: Auditoria visual do site publicado
on:
  push:
    paths:
      - '.github/workflows/auditoria-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar navegador para capturas
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Inspecionar desktop mobile e fluxos
        run: |
          mkdir -p auditoria
          cat > /tmp/auditoria.py <<'PY'
          import json,os
          from playwright.sync_api import sync_playwright
          target="https://ateliello.com.br/"
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              data={}
              for mode,opts in [
                  ("desktop",{"viewport":{"width":1440,"height":900},"device_scale_factor":1}),
                  ("mobile",{"viewport":{"width":390,"height":844},"device_scale_factor":1,"is_mobile":True,"has_touch":True})
              ]:
                  page=browser.new_page(**opts)
                  errors=[]; console=[]
                  page.on("pageerror",lambda e: errors.append(str(e)))
                  page.on("console",lambda m:console.append(m.text) if m.type=="error" else None)
                  response=page.goto(target,wait_until="networkidle",timeout=45000)
                  page.wait_for_timeout(1200)
                  page.screenshot(path=f"auditoria/{mode}-visivel.png",full_page=False)
                  page.screenshot(path=f"auditoria/{mode}-pagina-real.png",full_page=True)
                  page.locator(".brand").first.screenshot(path=f"auditoria/{mode}-logo.png")
                  stats=page.evaluate("""() => ({
                    title:document.title,
                    viewport:window.innerWidth,
                    bodyScroll:document.body.scrollWidth,
                    height:document.documentElement.scrollHeight,
                    heroHeadline:document.querySelector('h1')?.innerText,
                    navLinks:[...document.querySelectorAll('nav.main-nav a')].map(a=>a.textContent.trim()).slice(0,24),
                    headerRect:document.querySelector('.site-head')?.getBoundingClientRect().toJSON(),
                    logo:(() => {const img=document.querySelector('.brand img'); const r=img?.getBoundingClientRect();return img?{src:img.currentSrc,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,rect:r.toJSON(),filter:getComputedStyle(img).filter,blend:getComputedStyle(img).mixBlendMode,mask:getComputedStyle(img).maskImage,loaded:img.complete}:null;})(),
                    hero:(() => {const img=document.querySelector('.hero-image img');return img?{loaded:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,rect:img.getBoundingClientRect().toJSON()}:null;})(),
                    reveal:{count:document.querySelectorAll('.reveal').length,visible:document.querySelectorAll('.reveal.visible').length},
                    assistant:!!document.querySelector('.at-assistant-toggle'),
                    wa:!!document.querySelector('.floating-wa'),
                    menuToggle:document.querySelector('.menu-toggle')?.getBoundingClientRect().toJSON()
                  })""")
                  if mode=="desktop":
                    page.locator('.menu-drop button').first.hover()
                    page.wait_for_timeout(150)
                    page.screenshot(path="auditoria/desktop-menu.png")
                  else:
                    page.locator('.menu-toggle').first.click()
                    page.wait_for_timeout(180)
                    page.screenshot(path="auditoria/mobile-menu.png")
                  # Compare actual page appearance with intended styling if reveal elements are unblocked.
                  page.evaluate("""() => document.querySelectorAll('.reveal').forEach(e=>e.classList.add('visible'))""")
                  page.screenshot(path=f"auditoria/{mode}-layout-visivel.png",full_page=True)
                  try:
                    page.locator('.at-assistant-toggle').first.click(timeout=2000)
                    page.wait_for_timeout(250)
                    page.screenshot(path=f"auditoria/{mode}-assistente.png")
                    stats["assistantOpened"]=page.locator('.at-assistant-dialog').is_visible()
                  except Exception as e:
                    stats["assistantOpenError"]=str(e)[:300]
                  data[mode]={"status":response.status if response else None,"metrics":stats,"pageErrors":errors,"consoleErrors":console}
                  page.close()
              browser.close()
          with open("auditoria/resultado.json","w") as f:json.dump(data,f,ensure_ascii=False,indent=2)
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          python /tmp/auditoria.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ateliello-auditoria-visual
          path: auditoria/
          retention-days: 7
